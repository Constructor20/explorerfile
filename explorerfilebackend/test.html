
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Glass UI</title>
<style>
    body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #74b0ff, #b38bff);
        height: 100vh;
        padding: 40px;
        color: white;
    }

    .glass-container {
        display: grid;
        grid-template-columns: 350px 1fr;
        gap: 30px;
        backdrop-filter: blur(20px);
    }

    .glass {
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 15px;
        padding: 25px;
        backdrop-filter: blur(15px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    h3 {
        margin-top: 0;
        font-weight: 600;
        color: #fff;
    }

    /* Checkbox items */
    .glass-item {
        padding: 10px;
        border: 1px solid rgba(255,255,255,0.4);
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        transition: 0.2s;
        cursor: pointer;
        color: #fff;
    }

    .glass-item:hover {
        background: rgba(255,255,255,0.25);
    }

    input[type="checkbox"] {
        transform: scale(1.3);
        margin-right: 10px;
    }

    table {
        width: 100%;
        color: #fff;
    }

    td, th {
        padding: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.3);
    }
</style>
</head>

<body>

<div class="glass-container">

    <div class="glass">
        <h3>Formats</h3>
        <label class="glass-item">
            <input type="checkbox" checked>
            PDF
        </label>
        <label class="glass-item">
            <input type="checkbox">
            JPG
        </label>
        <label class="glass-item">
            <input type="checkbox" checked>
            PNG
        </label>
    </div>

    <div class="glass">
        <h3>Chemins utilisateur</h3>
        <table>
            <tr><td>/mnt/data/project/test.txt</td></tr>
            <tr><td>/home/user/images/img.png</td></tr>
        </table>
    </div>

</div>

</body>
</html>
